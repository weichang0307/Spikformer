<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Monitor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg: #fafafa; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --border: #e3e3e6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --card: #1f1f22; --text: #f2f2f4; --muted: #9a9aa0; --border: #333338; }
  }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0; }
  details.section > summary { font-size: 13px; margin: 12px 0 6px; color: var(--muted); font-weight: 600;
                              cursor: pointer; user-select: none; }
  details.run > summary { cursor: pointer; user-select: none; list-style-position: outside; }
  details.run > summary h2 { display: inline; }
  details.chart > summary { font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; margin: 2px 0; }
  .muted { color: var(--muted); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; min-width: 0; }
  .card h2 { font-size: 15px; margin: 0 0 4px; }
  .stats { font-variant-numeric: tabular-nums; margin-bottom: 8px; }
  .stats b { font-weight: 600; }
  .charts { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .charts > div, .charts > details { min-width: 0; }
  canvas { width: 100% !important; height: 220px !important; }
  pre.sample { margin: 8px 0 0; padding: 8px; max-height: 220px; overflow: auto; white-space: pre-wrap;
               background: var(--bg); border: 1px solid var(--border); border-radius: 6px; font-size: 12px; }
  @media (max-width: 420px) { body { padding: 8px; } .grid, .charts { grid-template-columns: 1fr; } }
  #picker { position: relative; }
  #picker > summary { cursor: pointer; user-select: none; padding: 3px 10px; border: 1px solid var(--border);
                      border-radius: 6px; background: var(--card); list-style: none; }
  #picker .pick { position: absolute; z-index: 10; top: 30px; left: 0; width: min(520px, calc(100vw - 32px));
                  max-height: 60vh; overflow: auto; background: var(--card); border: 1px solid var(--border);
                  border-radius: 8px; padding: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
  #picker input[type=text] { width: 100%; box-sizing: border-box; margin-bottom: 6px; padding: 4px 6px; font: inherit;
                             color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
  #picker label { display: flex; gap: 6px; align-items: baseline; padding: 2px 0; font-size: 13px; cursor: pointer; }
  #picker .when { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; }
  #picker .live { color: #2fa86b; }
  #picker button { font: inherit; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--border);
                   background: var(--bg); color: var(--text); cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Training Monitor</h1>
  <details id="picker"><summary>runs ▾</summary>
    <div class="pick">
      <input type="text" id="pickFilter" placeholder="filter runs…">
      <div id="pickList" class="muted">loading runs…</div>
      <div style="display:flex; gap:8px; margin-top:8px">
        <button id="pickApply">show selected</button><button id="pickClear">clear</button>
      </div>
    </div>
  </details>
  <span class="muted">Refreshes every 5 s. Stop a run: <code>touch runs/&lt;run&gt;/STOP</code></span>
  <a id="pg" href="playground.html">model playground</a>
</header>
<div class="grid" id="grid"></div>
<script>
const params = new URLSearchParams(location.search);
// the playground needs playground_server.py (port 8770); link there unless this page is already served by it
if (location.port !== "8770") document.getElementById("pg").href = `http://${location.hostname}:8770/playground.html`;
// runs to show: ?runs=a,b, else the last selection on this browser, else the most recently updated run
const storedRuns = (() => { try { return localStorage.getItem("dash_runs"); } catch (e) { return null; } })();
const RUNS = (params.get("runs") || storedRuns || "").split(",").filter(Boolean);
try { if (RUNS.length) localStorage.setItem("dash_runs", RUNS.join(",")); } catch (e) {}

// run picker: every run folder with a live.json, newest first (from the server's directory listing)
async function listRuns() {
  const html = await (await fetch("runs/", { cache: "no-store" })).text();
  const names = [...html.matchAll(/href="([^"\/?]+)\/"/g)].map(m => decodeURIComponent(m[1]));
  const found = await Promise.all(names.map(async name => {
    try {
      const r = await fetch(`runs/${encodeURIComponent(name)}/live.json`, { method: "HEAD", cache: "no-store" });
      return r.ok ? { name, t: Date.parse(r.headers.get("Last-Modified")) || 0 } : null;
    } catch (e) { return null; }
  }));
  return found.filter(Boolean).sort((a, b) => b.t - a.t);
}
function ago(t) {
  const m = (Date.now() - t) / 60000;
  return m < 60 ? `${Math.round(m)} min ago` : m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`;
}
function showRuns(list) {
  if (!list.length) return;
  const url = new URL(location.href); url.searchParams.set("runs", list.join(","));
  location.href = url.toString();
}
listRuns().then(runs => {
  if (!RUNS.length && runs.length) return showRuns([runs[0].name]);   // nothing chosen yet: newest run
  const box = document.getElementById("pickList"), filter = document.getElementById("pickFilter");
  const render = () => {
    const q = filter.value.toLowerCase();
    box.classList.remove("muted");
    box.innerHTML = runs.filter(r => r.name.toLowerCase().includes(q)).map(r =>
      `<label><input type="checkbox" value="${r.name}"${RUNS.includes(r.name) ? " checked" : ""}> ${r.name}` +
      `<span class="when${Date.now() - r.t < 15 * 60000 ? " live" : ""}">${Date.now() - r.t < 15 * 60000 ? "● " : ""}${ago(r.t)}</span></label>`).join("")
      || '<span class="muted">no matching runs</span>';
  };
  filter.oninput = render;
  render();
  document.getElementById("pickApply").onclick = () =>
    showRuns([...box.querySelectorAll("input:checked")].map(i => i.value));
  document.getElementById("pickClear").onclick = () => box.querySelectorAll("input").forEach(i => i.checked = false);
}).catch(() => { document.getElementById("pickList").textContent = "could not list runs/"; });
const COLORS = { train: "#9a9aa0", 2: "#c9a227", 4: "#e0803a", 6: "#d6455d", 8: "#3a8ee0", 12: "#17a2b8",
                 16: "#2fa86b", 24: "#8a6d3b", 32: "#a35cd6", 64: "#555555" };
const T_FALLBACK = ["#e377c2", "#7f7f7f", "#bcbd22", "#1f77b4"];
const colorT = T => COLORS[T] || T_FALLBACK[T % T_FALLBACK.length];   // one fixed colour per T, across runs
const GROUP_COLORS = { input: "#9a9aa0", head: "#8a6d3b" };
// one colour per block, for models up to 16 blocks deep (blocks 0-5 keep their earlier colours)
const BLOCK_COLORS = ["#e0803a", "#3a8ee0", "#2fa86b", "#a35cd6", "#d64f7a", "#3ab0b0", "#c9a227", "#1f4e9c",
                      "#7a9c1f", "#e04a3a", "#6b4fd6", "#1f9c6e", "#b05a9c", "#5a6b7a", "#e0b03a", "#3a5ae0"];
const groupColor = g => GROUP_COLORS[g] || (g.startsWith("block ") ? BLOCK_COLORS[+g.slice(6) % BLOCK_COLORS.length] : "#888");

// Training-health panels (fields written by health.py via train_char.py).
// perLIF: values keyed by LIF name, averaged per block; pct: plot as %; log: log y axis.
const HEALTH = [
  { section: "Spiking activity (val set, training T)" },
  { field: "fire_rate", title: "LIF firing rate (%)", perLIF: true, pct: true, fixed: [0, 100] },
  { field: "fire_dead", title: "never-fired features (%)", perLIF: true, pct: true, floor10: true },
  { field: "fire_sat", title: "saturated features, rate ≥ 90% (%)", perLIF: true, pct: true, floor10: true },
  { field: "surrogate", title: "mean surrogate gradient (peak α/4; 0.5 at α = 2)", perLIF: true, min: 0 },
  { section: "Optimisation" },
  { field: "lr", title: "learning rate (log)", scalar: true, log: true },
  { field: "surrogate_alpha", title: "surrogate gradient α (steepness; peak α/4)", scalar: true },
  { section: "Distillation from the ANN teacher" },
  { field: "train_kl", title: "output KL to the teacher (nats, train)", scalar: true },
  { field: "ce_weight", title: "CE weight of the output loss (1 − weight on output KL)", scalar: true },
  { field: "attn_weight", title: "attention-distillation weight λ", scalar: true },
  { field: "train_attn_kl", title: "attention KL, student vs teacher heads (nats, train)", scalar: true },
  { field: "grad_norm", title: "gradient norm (log)", log: true },
  { field: "update_ratio", title: "update / weight norm per step (log)", log: true },
  { field: "norm_gain", title: "mean |L1 norm gain|", min: 0 },
  { field: "gamma_min", title: "min L1 norm gain γ per block" },
  { field: "gamma_max", title: "max L1 norm gain γ per block" },
  { field: "beta_min", title: "min L1 norm bias β per block" },
  { field: "beta_max", title: "max L1 norm bias β per block" },
  { field: "attn_scale", title: "SSA attention scale 2^s (log)", log: true, hideIfConstant: true },
  { field: "head_scale_spread", title: "largest / smallest head scale (log)", log: true, hideIfConstant: true },
  { section: "Attention and context use" },
  { field: "attn_dead_heads", title: "dead heads, attention LIF < 0.5% (%)", pct: true, min: 0, max: 100 },
  { field: "attn_empty", title: "query rows with no Q·K overlap (%)", pct: true, min: 0, max: 100 },
  { field: "attn_threshold", title: "learned Q·K count threshold (mean of thresholded heads)" },
  { field: "attn_entropy", title: "attention spread (1 = uniform over context)", min: 0, max: 1 },
  { field: "attn_local", title: "attention on last 8 positions (%)", pct: true, min: 0 },
  { field: "context_gain", title: "context gain: loss(self only) − loss (nats)", scalar: true },
  { section: "Homeostatic bias (regulated NL units)" },
  { field: "homeo_active", title: "regulated features below target rate (%)", pct: true, min: 0, max: 100 },
  { field: "homeo_high", title: "regulated features above upper target (%)", pct: true, min: 0, max: 100 },
  { field: "homeo_shift", title: "mean regulated norm bias shift" },
  { field: "homeo_shift_up", title: "bias raised (mean over regulated features)" },
  { field: "homeo_shift_down", title: "bias lowered (mean over regulated features)" },
  { section: "Adaptive gradient clipping" },
  { field: "clip_frac", title: "steps clipped since last eval (%)", pct: true, min: 0 },
  { field: "grad_spike", title: "largest gradient / running average (log)", log: true },
];
const charts = {};

function makeChart(canvas, yLabel, yMin, yMax, yType = "linear") {
  return new Chart(canvas, {
    type: "line",
    data: { datasets: [] },
    options: {
      animation: false, parsing: false, normalized: true, maintainAspectRatio: false,
      scales: {
        x: { type: "linear", title: { display: true, text: "step" } },
        y: { type: yType, min: yMin, max: yMax, title: { display: true, text: yLabel } },
      },
      plugins: { legend: { labels: { boxWidth: 12 } } },
      elements: { point: { radius: 0 }, line: { borderWidth: 1.5 } },
    },
  });
}

function series(h, key) { return h.step.map((s, i) => ({ x: s, y: h[key][i] })); }

function groupOf(name) {
  const m = name.match(/^blocks\.(\d+)\./);
  return m ? `block ${m[1]}` : name.startsWith("head") ? "head" : name.startsWith("block ") ? name : "input";
}

function groupOrder(a, b) {
  const rank = g => g === "input" ? -1 : g === "head" ? 99 : +g.split(" ")[1];
  return rank(a) - rank(b);
}

// one line per block; per-LIF fields are averaged over each block's LIFs
function healthSeries(h, panel) {
  const k = panel.pct ? 100 : 1;
  if (panel.scalar) {
    const v = h[panel.field];
    return [{ label: "all", borderColor: "#3a8ee0",
              data: v.map((y, j) => ({ x: h.step[j + h.step.length - v.length], y: k * y })) }];
  }
  const groups = {};
  for (const [name, values] of Object.entries(h[panel.field])) (groups[groupOf(name)] ??= []).push(values);
  return Object.keys(groups).sort(groupOrder).map(g => {
    const lists = groups[g], n = Math.min(...lists.map(v => v.length));
    const offset = h.step.length - n;
    return {
      label: g, borderColor: groupColor(g),
      data: Array.from({ length: n }, (_, j) => ({
        x: h.step[j + offset],
        y: k * lists.reduce((sum, v) => sum + v[v.length - n + j], 0) / lists.length,
      })),
    };
  });
}

for (const run of RUNS) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<details class="run" data-key="run:${run}"><summary><h2>${run}</h2></summary>
    <div class="stats" id="stats-${run}">waiting for live.json…</div>
    <div id="body-${run}"></div></details>`;
  document.getElementById("grid").appendChild(card);
  const body = document.getElementById(`body-${run}`);
  body.appendChild(makeSection("Loss and accuracy",
    chartBoxHTML("next-char accuracy", `acc-${run}`) + chartBoxHTML("loss (log scale)", `loss-${run}`) +
    chartBoxHTML("bits per character", `bpc-${run}`)));
  body.querySelectorAll("details.chart").forEach(d => restoreOpen(d, true));
  body.insertAdjacentHTML("beforeend", `<div id="health-${run}"></div>`);
  const sample = makeSection("Latest sample", "", false);
  sample.id = `samplebox-${run}`;
  sample.hidden = true;
  sample.querySelector(".charts").outerHTML = `<pre class="sample" id="sample-${run}"></pre>`;
  body.appendChild(sample);
  restoreOpen(card.querySelector("details.run"), true);
  charts[run] = {
    acc: makeChart(document.getElementById(`acc-${run}`), "accuracy"),  // y range follows the data
    loss: makeChart(document.getElementById(`loss-${run}`), "loss (log scale)", undefined, undefined, "logarithmic"),
    bpc: makeChart(document.getElementById(`bpc-${run}`), "bits per character"),
    health: null,
  };
}

// build the health panels the first time a run's live.json has them
// Collapsible sections: a <details> per group of charts. Open / closed state is
// remembered per section title in this browser (a viewer convenience only).
function restoreOpen(details, byDefault) {
  let open = byDefault;
  try {
    const saved = localStorage.getItem("dash-open:" + details.dataset.key);
    if (saved !== null) open = saved === "1";
  } catch {}
  details.open = open;
  details.addEventListener("toggle", () => {
    try { localStorage.setItem("dash-open:" + details.dataset.key, details.open ? "1" : "0"); } catch {}
    // charts drawn while hidden have no size: resize them when the section opens
    if (details.open) details.querySelectorAll("canvas").forEach(c => Chart.getChart(c)?.resize());
  });
}

// one collapsible box per chart (state remembered per chart title)
function chartBoxHTML(title, canvasId) {
  return `<details class="chart" data-key="chart:${title}"><summary>${title}</summary>` +
         `<canvas${canvasId ? ` id="${canvasId}"` : ""}></canvas></details>`;
}

function makeSection(title, innerHTML, byDefault = true) {
  const d = document.createElement("details");
  d.className = "section";
  d.dataset.key = "section:" + title;
  d.innerHTML = `<summary>${title}</summary><div class="charts">${innerHTML}</div>`;
  restoreOpen(d, byDefault);
  return d;
}

function buildHealth(run, h) {
  const root = document.getElementById(`health-${run}`);
  const made = {};
  let box = null;
  for (const panel of HEALTH) {
    if (panel.section) {
      const sec = makeSection(panel.section, "");
      root.appendChild(sec);
      box = sec.querySelector(".charts");
      continue;
    }
    if (!(panel.field in h)) continue;
    box.insertAdjacentHTML("beforeend", chartBoxHTML(panel.title));
    const wrap = box.lastElementChild;
    const canvas = wrap.querySelector("canvas");
    restoreOpen(wrap, true);
    // y range follows the data on every chart (panel.min / max are not applied)
    // (panel.fixed: a fixed axis, used for the firing rate's 0-100%)
    made[panel.field] = makeChart(canvas, panel.title, panel.fixed?.[0], panel.fixed?.[1],
                                  panel.log ? "logarithmic" : "linear");
  }
  return made;
}

async function refresh() {
  for (const run of RUNS) {
    let h;
    try {
      const r = await fetch(`runs/${run}/live.json?t=${Date.now()}`, { cache: "no-store" });
      if (!r.ok) continue;
      h = await r.json();
    } catch { continue; }
    if (!h.step || !h.step.length) continue;
    // derived: steps per second between consecutive evaluations (wall clock, includes evaluation)
    if (h.time && h.time.length === h.step.length)
      h.steps_per_s = h.step.map((s, i) => i ? (s - h.step[i - 1]) / Math.max(h.time[i] - h.time[i - 1], 1e-9)
                                               : s / Math.max(h.time[0], 1e-9));
    const charLM = "bpc" in h;  // train_char.py run: next-character accuracy and bits per char
    if (charLM && !charts[run].charLM) {
      charts[run].charLM = true;
      charts[run].acc.options.scales.y.title.text = "next-char accuracy";
      charts[run].loss.options.scales.y.title.text = "loss (nats/char, log scale)";
    }
    const Ts = Object.keys(h).filter(k => k.startsWith("acc_T")).map(k => +k.slice(5)).sort((a, b) => a - b);
    for (const [metric, chart] of [["acc", charts[run].acc], ["loss", charts[run].loss]]) {
      chart.data.datasets = [
        { label: "train", data: series(h, `train_${metric}`), borderColor: COLORS.train, borderDash: [4, 3] },
        ...Ts.map(T => ({ label: `eval T=${T}`, data: series(h, `${metric}_T${T}`), borderColor: colorT(T) })),
      ];
      chart.update();
    }
    // bits per character: val at each eval T, train = train loss / ln 2 (char LM runs only)
    const bpcBox = charts[run].bpc.canvas.closest("details");
    bpcBox.style.display = charLM ? "" : "none";
    if (charLM) {
      charts[run].bpc.data.datasets = [
        { label: "train", data: h.step.map((s, i) => ({ x: s, y: h.train_loss[i] / Math.LN2 })),
          borderColor: COLORS.train, borderDash: [4, 3] },
        ...Ts.map(T => ({ label: `eval T=${T}`, data: series(h, `bpc_T${T}`), borderColor: colorT(T) })),
      ];
      charts[run].bpc.update();
    }
    if (!charts[run].health && HEALTH.some(p => p.field && p.field in h)) charts[run].health = buildHealth(run, h);
    for (const panel of HEALTH) {
      const chart = charts[run].health && charts[run].health[panel.field];
      if (!chart) continue;
      chart.data.datasets = healthSeries(h, panel);
      if (panel.floor10) {  // 0-10% axis while every value is below 10%, adaptive above that
        const top = Math.max(...chart.data.datasets.flatMap(d => d.data.map(p => p.y)));
        chart.options.scales.y.min = top < 10 ? 0 : undefined;
        chart.options.scales.y.max = top < 10 ? 10 : undefined;
      }
      // hide the attention-scale charts when the scale is fixed (not learnable) in this run
      if (panel.hideIfConstant) {
        const ys = chart.data.datasets.flatMap(d => d.data.map(p => p.y));
        chart.canvas.parentElement.style.display = ys.length > 1 && ys.every(y => y === ys[0]) ? "none" : "";
      }
      chart.update();
    }
    const last = h.step.length - 1;
    const pct = v => (100 * v).toFixed(1) + "%";
    const minutes = (h.time[last] / 60).toFixed(1);
    document.getElementById(`stats-${run}`).innerHTML =
      `step <b>${h.step[last]}</b> · ${minutes} min` +
      (h.steps_per_s ? ` · <b>${h.steps_per_s[last].toFixed(2)}</b> steps/s` : "") +
      ` · train <b>${pct(h.train_acc[last])}</b> · ` +
      Ts.map(T => `T=${T} <b>${pct(h[`acc_T${T}`][last])}</b>` +
                  (charLM ? ` / <b>${h[`bpc_T${T}`][last].toFixed(3)}</b> bpc` : "")).join(" · ") +
      (charLM ? ` · best <b>${Math.min(...h.bpc).toFixed(3)}</b> bpc` : "");
    if (charLM) {
      try {
        const r = await fetch(`runs/${run}/samples.txt?t=${Date.now()}`, { cache: "no-store" });
        if (r.ok) {
          const blocks = (await r.text()).split(/^=== /m).filter(b => b.trim());
          const el = document.getElementById(`sample-${run}`);
          if (blocks.length) {
            el.textContent = "=== " + blocks[blocks.length - 1].trimEnd();
            document.getElementById(`samplebox-${run}`).hidden = false;
          }
        }
      } catch {}
    }
  }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
